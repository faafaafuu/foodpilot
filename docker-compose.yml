services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: foodpilot
      POSTGRES_PASSWORD: foodpilot
      POSTGRES_DB: foodpilot
    ports:
      - '15432:5432'
    volumes:
      - foodpilot-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U foodpilot -d foodpilot']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    ports:
      - '16379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://foodpilot:foodpilot@postgres:5432/foodpilot?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: local-access-secret
      JWT_REFRESH_SECRET: local-refresh-secret
      AI_PROVIDER: mock
      STORE_PROVIDER: mock
      INSTACART_ENV: ${INSTACART_ENV:-production}
      INSTACART_API_KEY: ${INSTACART_API_KEY:-}
      INSTACART_API_BASE_URL: ${INSTACART_API_BASE_URL:-https://connect.instacart.com}
      SBERPAY_ENV: ${SBERPAY_ENV:-production}
      SBERPAY_API_BASE_URL: ${SBERPAY_API_BASE_URL:-https://ecommerce.sberbank.ru/ecomm/gw/partner/api/v1}
      SBERPAY_USER_NAME: ${SBERPAY_USER_NAME:-}
      SBERPAY_PASSWORD: ${SBERPAY_PASSWORD:-}
      SBERPAY_MERCHANT_LOGIN: ${SBERPAY_MERCHANT_LOGIN:-}
      SBERPAY_RETURN_URL: ${SBERPAY_RETURN_URL:-http://localhost:3000/checkout/success}
      SBERPAY_FAIL_URL: ${SBERPAY_FAIL_URL:-http://localhost:3000/checkout/fail}
    ports:
      - '3001:3001'

volumes:
  foodpilot-postgres:
